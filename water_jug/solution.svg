<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="title">
<title id="title">Water jug solution: four moves to measure two units</title>
<rect width="960" height="290" rx="16" fill="#f1f5f9"/>
<g font-family="sans-serif" text-anchor="middle" fill="#0f172a">
<text x="480" y="30" font-size="20" font-weight="bold">Measure 2 units with 4-unit and 3-unit jugs</text>
<text x="100" y="68" font-size="15">Step 0: Start</text>
<rect x="35" y="90" width="52" height="105" fill="white"/>
<rect x="35" y="195.0" width="52" height="0.0" fill="#38bdf8"/>
<path d="M35 85 V195 H87 V85" fill="none" stroke="#334155" stroke-width="3"/>
<text x="61" y="222" font-size="16">A: 0/4</text>
<rect x="110" y="90" width="52" height="105" fill="white"/>
<rect x="110" y="195.0" width="52" height="0.0" fill="#38bdf8"/>
<path d="M110 85 V195 H162 V85" fill="none" stroke="#334155" stroke-width="3"/>
<text x="136" y="222" font-size="16">B: 0/3</text>
<text x="192" y="150" font-size="22">→</text>
<text x="290" y="68" font-size="15">Step 1: Fill B</text>
<rect x="225" y="90" width="52" height="105" fill="white"/>
<rect x="225" y="195.0" width="52" height="0.0" fill="#38bdf8"/>
<path d="M225 85 V195 H277 V85" fill="none" stroke="#334155" stroke-width="3"/>
<text x="251" y="222" font-size="16">A: 0/4</text>
<rect x="300" y="90" width="52" height="105" fill="white"/>
<rect x="300" y="90.0" width="52" height="105.0" fill="#38bdf8"/>
<path d="M300 85 V195 H352 V85" fill="none" stroke="#334155" stroke-width="3"/>
<text x="326" y="222" font-size="16">B: 3/3</text>
<text x="382" y="150" font-size="22">→</text>
<text x="480" y="68" font-size="15">Step 2: Pour B → A</text>
<rect x="415" y="90" width="52" height="105" fill="white"/>
<rect x="415" y="116.25" width="52" height="78.75" fill="#38bdf8"/>
<path d="M415 85 V195 H467 V85" fill="none" stroke="#334155" stroke-width="3"/>
<text x="441" y="222" font-size="16">A: 3/4</text>
<rect x="490" y="90" width="52" height="105" fill="white"/>
<rect x="490" y="195.0" width="52" height="0.0" fill="#38bdf8"/>
<path d="M490 85 V195 H542 V85" fill="none" stroke="#334155" stroke-width="3"/>
<text x="516" y="222" font-size="16">B: 0/3</text>
<text x="572" y="150" font-size="22">→</text>
<text x="670" y="68" font-size="15">Step 3: Fill B</text>
<rect x="605" y="90" width="52" height="105" fill="white"/>
<rect x="605" y="116.25" width="52" height="78.75" fill="#38bdf8"/>
<path d="M605 85 V195 H657 V85" fill="none" stroke="#334155" stroke-width="3"/>
<text x="631" y="222" font-size="16">A: 3/4</text>
<rect x="680" y="90" width="52" height="105" fill="white"/>
<rect x="680" y="90.0" width="52" height="105.0" fill="#38bdf8"/>
<path d="M680 85 V195 H732 V85" fill="none" stroke="#334155" stroke-width="3"/>
<text x="706" y="222" font-size="16">B: 3/3</text>
<text x="762" y="150" font-size="22">→</text>
<text x="860" y="68" font-size="15">Step 4: Pour B → A</text>
<rect x="795" y="90" width="52" height="105" fill="white"/>
<rect x="795" y="90.0" width="52" height="105.0" fill="#38bdf8"/>
<path d="M795 85 V195 H847 V85" fill="none" stroke="#334155" stroke-width="3"/>
<text x="821" y="222" font-size="16">A: 4/4</text>
<rect x="870" y="90" width="52" height="105" fill="white"/>
<rect x="870" y="125.0" width="52" height="70.0" fill="#38bdf8"/>
<path d="M870 85 V195 H922 V85" fill="none" stroke="#334155" stroke-width="3"/>
<text x="896" y="222" font-size="16">B: 2/3</text>
<text x="480" y="264" font-size="16">Each arrow is one operation. Target reached in jug B.</text>
</g></svg>
